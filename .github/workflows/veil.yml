name: Veil Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veil-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Veil / tracked files
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VEIL_VERSION: 0.22.1
      VEIL_SHA256: 46fa1cc411493d7387aba3dfb348091bbec66936f7da5688627b60a4caf5208d
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify Veil
        shell: bash
        run: |
          set -euo pipefail
          asset="veil-${VEIL_VERSION}-x86_64-unknown-linux-musl.zip"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/mt4110/veil-rs/releases/download/v${VEIL_VERSION}/$asset"
          printf '%s  %s\n' "$VEIL_SHA256" "$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/veil-cli"
          unzip -q "$archive" -d "$RUNNER_TEMP/veil-cli"
          chmod u+x "$RUNNER_TEMP/veil-cli/veil"
          test "$("$RUNNER_TEMP/veil-cli/veil" --version)" = "veil $VEIL_VERSION"

      - name: Scan tracked files
        run: |
          python3 -m unittest discover -s scripts/tests -p test_ci_veil.py
          python3 scripts/ci_veil.py \
            --veil-bin "$RUNNER_TEMP/veil-cli/veil" \
            --report "$RUNNER_TEMP/veil-report/veil-report.json" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload report (including failed scans)
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: veil-report
          path: ${{ runner.temp }}/veil-report/veil-report.json
          if-no-files-found: warn
          retention-days: 7
