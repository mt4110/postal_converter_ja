name: Dependabot minor updates

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

permissions: {}

jobs:
  enable-automerge:
    if: >-
      github.repository == 'mt4110/postal_converter_ja' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for minor version updates
        env:
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$DEPENDENCY_GROUP" in
            cargo-minor|npm-minor|go-minor) ;;
            *) exit 0 ;;
          esac

          # The aggregate update type would also accept a mix of minor and patch updates.
          if ! jq -e --arg group "$DEPENDENCY_GROUP" '
            type == "array" and length > 0 and
            all(.[]; .dependencyGroup == $group and .updateType == "version-update:semver-minor")
          ' <<< "$UPDATED_DEPENDENCIES" >/dev/null; then
            exit 0
          fi

          gh pr merge "$PR_URL" --auto --squash --match-head-commit "$PR_HEAD"
