name: OSV Vulnerability Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: OSV / ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: [source, images]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified OSV-Scanner
        env:
          OSV_VERSION: 2.7.1
          OSV_SHA256: fb7dab19a8bd9bbe5c3189f09d4b7ee1820c9553a23bac202648a56efd2f6ee8
        run: |
          tool_dir="$RUNNER_TEMP/osv"
          mkdir -p "$tool_dir"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$tool_dir/osv-scanner" \
            "https://github.com/google/osv-scanner/releases/download/v$OSV_VERSION/osv-scanner_linux_amd64"
          printf '%s  %s\n' "$OSV_SHA256" "$tool_dir/osv-scanner" | sha256sum --check --strict
          chmod u+x "$tool_dir/osv-scanner"
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Install verified Trivy
        if: matrix.target == 'images'
        env:
          TRIVY_VERSION: 0.76.2
          TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        run: |
          asset="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          archive="$RUNNER_TEMP/$asset"
          curl --fail --location --silent --show-error --retry 3 \
            --output "$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/$asset"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP/osv" trivy

      - name: Create a builder with Docker archive export support
        if: matrix.target == 'images'
        run: docker buildx create --name postal-osv-export --driver docker-container

      - name: Scan repository
        env:
          POSTAL_OSV_EXPORT_BUILDER: ${{ matrix.target == 'images' && 'postal-osv-export' || '' }}
        run: bash scripts/security-scan.sh ${{ matrix.target }}
