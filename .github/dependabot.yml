version: 2
updates:
  # Maintain GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Maintain Rust dependencies using the shared workspace lockfile.
  - package-ecosystem: "cargo"
    directory: "/worker"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor:
        applies-to: version-updates
        update-types: [minor]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Maintain Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      npm-minor:
        applies-to: version-updates
        update-types: [minor]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Maintain Go dependencies (Launcher)
  - package-ecosystem: "gomod"
    directory: "/launcher"
    schedule:
      interval: "weekly"
    groups:
      go-minor:
        applies-to: version-updates
        update-types: [minor]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
