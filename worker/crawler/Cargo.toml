[package]
name = "crawler_service"
version = "0.8.0"
edition = "2024"

[dependencies]
tokio-postgres = { version = "0.7", features = ["with-time-0_3"] }
dotenv = { package = "dotenvy", version = "0.15.7" }
futures = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13", features = [
  "json",
  "blocking",
  "default-tls",
  "stream",
] }
tokio = { version = "1.40", features = ["full"] }
rayon = "1.10"
csv = "1.3"
csv-async = "1.3"
zip = "9.5"
serde = { version = "1.0", features = ["derive"] }
common = { path = "../common" }
deadpool-postgres = { version = "0.14", features = ["serde"] }
mysql_async = { version = "0.37.1", default-features = false, features = [
  "default",
  "time",
] }
num_cpus = "1.16"
time = { version = "0.3.55", features = ["formatting", "macros"] }
jiff = "0.2"
encoding_rs = "0.8.35"
redis = { version = "1.0", features = ["tokio-comp"] }

[[bin]]
name = "crawler"
path = "src/main.rs"

[[bin]]
name = "rollback"
path = "src/bin/rollback.rs"


[lib]
path = "src/lib.rs"
